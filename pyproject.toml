[project]
name = "parts-app"
version = "0.2.0"
description = "Local browser-controlled TME sourcing and validation"
requires-python = ">=3.13"
dependencies = ["flask==3.1.3", "pydantic-ai-slim[openrouter]==2.66.0", "python-dotenv==1.2.4", "waitress==3.0.2"]

[project.scripts]
parts-app = "parts_app.web:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "ty==0.0.99"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ty.rules]
import-not-found = "error"
