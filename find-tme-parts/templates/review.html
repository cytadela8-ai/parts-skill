<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TME BOM review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
    <script defer src="{{ url_for('static', filename='review.js') }}"></script>
  </head>
  <body>
    <main class="review-layout">
      <section class="bom-panel" aria-labelledby="bom-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Final CSV</p>
            <h2 id="bom-heading">{{ final_csv_name }}</h2>
          </div>
          <output id="row-count" aria-live="polite"></output>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button class="sort-button" data-key="Reference">Reference</button></th>
                <th><button class="sort-button" data-key="Value">Value</button></th>
                <th><button class="sort-button" data-key="Qty">Original Qty</button></th>
                <th>
                  <button class="sort-button" data-key="Final Item Count">Final Item Count</button>
                </th>
                <th>
                  <button class="sort-button" data-key="TME Symbol">Selected TME part</button>
                </th>
                <th>
                  <button class="sort-button" data-key="Unit Price PLN">Unit Price PLN</button>
                </th>
                <th>
                  <button class="sort-button" data-key="Line Total PLN">Line Total PLN</button>
                </th>
                <th>
                  <button class="sort-button" data-key="TME Match Status">Status</button>
                </th>
              </tr>
            </thead>
            <tbody id="parts-table"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
