<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TME BOM review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
    <script defer src="{{ url_for('static', filename='review.js') }}"></script>
  </head>
  <body>
    <main class="review-layout">
      <section class="bom-panel" aria-labelledby="bom-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Final CSV</p>
            <h2 id="bom-heading">{{ final_csv_name }}</h2>
          </div>
          <div class="table-tools">
            <output id="row-count" aria-live="polite"></output>
            <button id="download-basket-button" type="button">Download basket CSV</button>
            <button id="settings-button" type="button">Table settings</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-column="Reference">
                  <button class="sort-button" data-key="Reference">Reference</button>
                </th>
                <th data-column="Value">
                  <button class="sort-button" data-key="Value">Value</button>
                </th>
                <th data-column="Footprint">
                  <button class="sort-button" data-key="Footprint">KiCad footprint</button>
                </th>
                <th data-column="Qty">
                  <button class="sort-button" data-key="Qty">Original Qty</button>
                </th>
                <th data-column="Final Item Count">
                  <button class="sort-button" data-key="Final Item Count">Final Item Count</button>
                </th>
                <th data-column="TME Symbol">
                  <button class="sort-button" data-key="TME Symbol">Selected TME part</button>
                </th>
                <th data-column="Unit Price PLN">
                  <button class="sort-button" data-key="Unit Price PLN">Unit Price PLN</button>
                </th>
                <th data-column="Line Total PLN">
                  <button class="sort-button" data-key="Line Total PLN">Line Total PLN</button>
                </th>
                <th data-column="TME Match Status">
                  <button class="sort-button" data-key="TME Match Status">Status</button>
                </th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="parts-table"></tbody>
          </table>
        </div>
      </section>
    </main>
    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Displayed columns</h2>
        <div id="column-settings"></div>
        <button>Done</button>
      </form>
    </dialog>
  </body>
</html>
